<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        /* হেডার সেকশন */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 25px auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* ক্যাটাগরি বাটন */
        .category-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #007bff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .category-btn:hover, .category-btn.active {
            background-color: #007bff;
            color: #ffffff;
        }

        /* সার্চ বক্স */
        .search-box {
            width: 100%;
            max-width: 280px;
            padding: 9px 18px;
            font-size: 15px;
            border: 2px solid #007bff;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* গ্যালারি কন্টেইনার: প্রতি সারিতে ঠিক ৭টি করে বক্স */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr); 
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ছবির সিঙ্গেল বক্স */
        .image-box {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .image-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* ছবি রাখার ঘর (এক সমান স্কয়ার রাখার জন্য aspect-ratio) */
        .image-wrapper {
            cursor: pointer;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #eaeaea;
        }

        /* ছবির সাইজ নির্দিষ্ট করে দেওয়া */
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ছবির নিচের নাম */
        .image-title {
            padding: 8px 5px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            background-color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 35px;
            line-height: 20px;
        }

        /* ডাউনলোড বাটন স্টাইল */
        .download-btn {
            display: block;
            background-color: #28a745;
            color: #ffffff;
            text-align: center;
            padding: 8px 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            height: 35px;
            line-height: 20px;
            transition: background-color 0.2s ease;
        }

        .download-btn:hover {
            background-color: #218838;
        }

        /* লুকানোর জন্য class */
        .hidden {
            display: none !important;
        }

        /* রেসপন্সিভ ব্রেকপয়েন্ট */
        @media (max-width: 1200px) {
            .gallery-container {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-section {
                flex-direction: column;
                align-items: stretch;
            }
            .category-options {
                justify-content: center;
            }
            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

            <button class="category-btn" onclick="switchCategory('Theme', this)">Theme</button>
            <button class="category-btn" onclick="switchCategory('Game', this)">Game</button>
            <button class="category-btn" onclick="switchCategory('Windows', this)">Windows</button>
        </div>

        <!-- সার্চ বক্স -->

            id="searchInput" 
            class="search-box"

    <script>
        let activeCategory = 'Windows'; // ডিফোল্ট ক্যাটাগরি Windows সেট করা
        let pendingClick = null;

        window.onload = function() {
            // প্রথমবার পেজ লোড হলে Windows ক্যাটাগরি একটিভ দেখাবে
            switchCategory('Windows', document.querySelectorAll('.category-btn')[3]);
        };

        // ১ম লিংকে ক্লিক ও টাইমিং ট্র্যাকিং
        function handleImageClick(element) {
            let firstLink = element.getAttribute('data-first-link');
            let secondLink = element.getAttribute('data-second-link');
            let parentBox = element.closest('.image-box');

            pendingClick = {
                box: parentBox,
                secondLink: secondLink,
                startTime: Date.now()
            };

            window.open(firstLink, '_blank');
        }

        // ইউজার ব্যাক আসলে ৭ সেকেন্ড সময় চেক করা
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && pendingClick) {
                let timeSpent = (Date.now() - pendingClick.startTime) / 1000;

                if (timeSpent >= 7) {
                    showDownloadButton(pendingClick.box, pendingClick.secondLink);
                } else {
                    alert("ডাউনলোড করতে ১ম ওয়েবসাইটটিতে অন্তত ৭ সেকেন্ড অপেক্ষা করুন!");
                }

                pendingClick = null;
            }
        });

        // নাম সরিয়ে ডাউনলোড বাটন দেখানোর ফাংশন
        function showDownloadButton(box, secondLink) {
            let titleElement = box.querySelector('.image-title');
            if (titleElement) {
                let downloadBtn = document.createElement('a');
                downloadBtn.href = secondLink;
                downloadBtn.target = "_blank";
                downloadBtn.className = "download-btn";
                downloadBtn.innerText = "Download";

                titleElement.replaceWith(downloadBtn);
            }
        }

        // ক্যাটাগরি পরিবর্তনের ফাংশন
        function switchCategory(category, btn) {
            activeCategory = category;

            let buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            document.getElementById('searchInput').value = '';
            filterImages();
        }

        // সার্চ ও ফিল্টার
        function filterImages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let boxes = document.querySelectorAll('.image-box');

            boxes.forEach(function(box) {
                let titleElement = box.querySelector('.image-title') || box.querySelector('.download-btn');
                let textContent = titleElement ? titleElement.innerText.toLowerCase() : '';
                let category = box.getAttribute('data-category');

                if (category === activeCategory && textContent.includes(input)) {
                    box.classList.remove('hidden');
                } else {
                    box.classList.add('hidden');
                }
            });
        }
    </script>
