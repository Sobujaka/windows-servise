<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        /* হেডার সেকশন */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 25px auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* ক্যাটাগরি বাটন */
        .category-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #007bff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .category-btn:hover, .category-btn.active {
            background-color: #007bff;
            color: #ffffff;
        }

        /* সার্চ বক্স */
        .search-box {
            width: 100%;
            max-width: 280px;
            padding: 9px 18px;
            font-size: 15px;
            border: 2px solid #007bff;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* গ্যালারি কন্টেইনার (প্রতি লাইনে ৭টি করে বক্স) */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr); 
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ছবির সিঙ্গেল বক্স */
        .image-box {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .image-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .image-wrapper {
            cursor: pointer;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ছবির নিচের নাম */
        .image-title {
            padding: 8px 5px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #333333;
            background-color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ডাউনলোড বাটন স্টাইল */
        .download-btn {
            display: block;
            background-color: #28a745;
            color: #ffffff;
            text-align: center;
            padding: 8px 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .download-btn:hover {
            background-color: #218838;
        }

        /* লুকানোর জন্য */
        .hidden {
            display: none !important;
        }

        /* রেসপন্সিভ ব্রেকপয়েন্ট */
        @media (max-width: 1024px) {
            .gallery-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-section {
                flex-direction: column;
                align-items: stretch;
            }
            .category-options {
                justify-content: center;
            }
            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <!-- ক্যাটাগরি বাটনসমূহ -->
        <div class="category-options">
            <button class="category-btn active" onclick="switchCategory('Software', this)">Software</button>
            <button class="category-btn" onclick="switchCategory('Theme', this)">Theme</button>
            <button class="category-btn" onclick="switchCategory('Game', this)">Game</button>
            <button class="category-btn" onclick="switchCategory('Windows', this)">Windows</button>
        </div>

        <!-- সার্চ বক্স -->
        <input 
            type="text" 
            id="searchInput" 
            class="search-box" 
            placeholder="Search..." 
            onkeyup="filterImages()"
        >
    </div>

    <div class="gallery-container">
        
        <!-- ==================== 1. SOFTWARE SECTION ==================== -->
        <div class="image-box" data-category="Software">
            <div class="image-wrapper" data-first-link="https://google.com" data-second-link="https://github.com" onclick="handleImageClick(this)">
                <img src="https://picsum.photos/id/10/300/300" alt="Photoshop">
            </div>
            <div class="image-title">Photoshop</div>
        </div>

        <div class="image-box" data-category="Software">
            <div class="image-wrapper" data-first-link="https://google.com" data-second-link="https://github.com" onclick="handleImageClick(this)">
                <img src="https://picsum.photos/id/14/300/300" alt="VS Code">
            </div>
            <div class="image-title">VS Code</div>
        </div>

        <!-- ==================== 2. THEME SECTION ==================== -->
        <div class="image-box" data-category="Theme">
            <div class="image-wrapper" data-first-link="https://google.com" data-second-link="https://github.com" onclick="handleImageClick(this)">
                <img src="https://picsum.photos/id/11/300/300" alt="Dark Theme">
            </div>
            <div class="image-title">Dark Theme</div>
        </div>

        <!-- ==================== 3. GAME SECTION ==================== -->
        <div class="image-box" data-category="Game">
            <div class="image-wrapper" data-first-link="https://google.com" data-second-link="https://github.com" onclick="handleImageClick(this)">
                <img src="https://picsum.photos/id/12/300/300" alt="GTA V">
            </div>
            <div class="image-title">GTA V</div>
        </div>

        <!-- ==================== 4. WINDOWS SECTION ==================== -->
        <div class="image-box" data-category="Windows">
            <div class="image-wrapper" data-first-link="https://google.com" data-second-link="https://github.com" onclick="handleImageClick(this)">
                <img src="https://picsum.photos/id/13/300/300" alt="Windows 11">
            </div>
            <div class="image-title">Windows 11 Pro</div>
        </div>

    </div>

    <script>
        let activeCategory = 'Software';
        let pendingClick = null;

        window.onload = function() {
            filterImages();
        };

        // ১ম লিংকে ক্লিক ও টাইমিং শুরু
        function handleImageClick(element) {
            let firstLink = element.getAttribute('data-first-link');
            let secondLink = element.getAttribute('data-second-link');
            let parentBox = element.closest('.image-box');

            // বর্তমান সময় এবং ক্লিক করা বক্স সেভ করা
            pendingClick = {
                box: parentBox,
                secondLink: secondLink,
                startTime: Date.now()
            };

            // নতুন ট্যাবে ১ম লিংক ওপেন করা
            window.open(firstLink, '_blank');
        }

        // ইউজার ব্যাক আসলে বা এই ট্যাবে ফেরত আসলে সময় চেক করা
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && pendingClick) {
                let timeSpent = (Date.now() - pendingClick.startTime) / 1000; // সেকেন্ডে রূপান্তর

                // যদি ৭ সেকেন্ড বা তার বেশি সময় ১ম ওয়েবসাইটে অবস্থান করে
                if (timeSpent >= 7) {
                    showDownloadButton(pendingClick.box, pendingClick.secondLink);
                } else {
                    alert("ডাউনলোড করতে ১ম ওয়েবসাইটটিতে অন্তত ৭ সেকেন্ড অপেক্ষা করুন!");
                }

                // প্রসেস শেষ হলে ট্র্যাকিং রিসেট করা
                pendingClick = null;
            }
        });

        // নাম সরিয়ে ডাউনলোড বাটন দেখানোর ফাংশন
        function showDownloadButton(box, secondLink) {
            let titleElement = box.querySelector('.image-title');
            if (titleElement) {
                let downloadBtn = document.createElement('a');
                downloadBtn.href = secondLink;
                downloadBtn.target = "_blank";
                downloadBtn.className = "download-btn";
                downloadBtn.innerText = "Download";

                titleElement.replaceWith(downloadBtn);
            }
        }

        // ক্যাটাগরি পরিবর্তনের ফাংশন
        function switchCategory(category, btn) {
            activeCategory = category;

            let buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('searchInput').value = '';
            filterImages();
        }

        // সার্চ ও ফিল্টার
        function filterImages() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let boxes = document.querySelectorAll('.image-box');

            boxes.forEach(function(box) {
                let titleElement = box.querySelector('.image-title') || box.querySelector('.download-btn');
                let textContent = titleElement ? titleElement.innerText.toLowerCase() : '';
                let category = box.getAttribute('data-category');

                if (category === activeCategory && textContent.includes(input)) {
                    box.classList.remove('hidden');
                } else {
                    box.classList.add('hidden');
                }
            });
        }
    </script>

</body>
</html>
